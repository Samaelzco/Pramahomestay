name: prama-homestay

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prama_homestay}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-prama_homestay}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-3000}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-prama-homestay}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-prama-homestay-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-prama-homestay-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
    command:
      - sh
      - -c
      - php artisan migrate --force && php artisan permission:cache-reset && php artisan storage:link --force && cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8000/up
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  queue:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-prama_homestay}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-prama-homestay}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-prama-homestay-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-prama-homestay-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: ["php", "artisan", "queue:work", "--queue=emails", "--tries=3", "--timeout=60", "--sleep=3"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  scheduler:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-prama_homestay}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-prama-homestay}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-prama-homestay-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-prama-homestay-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  reverb:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      REVERB_APP_ID: ${REVERB_APP_ID:-prama-homestay}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-prama-homestay-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-prama-homestay-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_ALLOWED_ORIGINS: localhost,127.0.0.1
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_URL: http://backend:8000/api
      INTERNAL_API_TIMEOUT_MS: ${INTERNAL_API_TIMEOUT_MS:-12000}
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
      NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-prama-homestay-local-key}
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: ${REVERB_PORT:-8080}
      NEXT_PUBLIC_REVERB_SCHEME: http
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      reverb:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=- http://127.0.0.1:3000/internal/login > /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  backend_vendor:
  frontend_next:
  frontend_node_modules:
  postgres_data:
